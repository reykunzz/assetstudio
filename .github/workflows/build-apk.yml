name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build APK
        run: dotnet build app/AssetStudioAndroid.csproj -c Release -p:AndroidPackageFormat=apk

      - name: Collect APK
        run: |
          mkdir -p out
          find app/bin -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: AssetStudioAndroid-apk
          path: out/*.apk
